name: Publish DAWAT to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'README.md'
      - 'PATHS.md'
      - 'CANVA_PATH.md'
      - 'data/canva/**'
      - 'scripts/import-canva*.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dawat-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone HTML and absence of other project dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in t
          for v in ('theme-royal','theme-emerald','localStorage','exportPNG','showGuest'):
              assert v in t, v
          assert '<script>' in t
          assert not any(x in t.lower() for x in ('sabeq','lovable.app','chatgpt.site'))
          print('DAWAT standalone verification: PASS')
          PY
      - name: Run catalog and JavaScript checks
        run: |
          node --check assets/catalog.js
          node --check assets/canva-pro-ui.js
          node --check assets/canva-pro-collections.js
          node --check assets/canva-verified.js
          node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
