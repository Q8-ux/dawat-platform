name: Bootstrap and publish independent DAWAT
on:
  push:
    branches: [main]
    paths:
      - 'source-payload.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dawat-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed independent source
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, tarfile
          payload = base64.b64decode(pathlib.Path("source-payload.b64").read_text())
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as tar:
              for m in tar.getmembers():
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                      raise SystemExit(f'Unsafe archive entry: {m.name}')
              tar.extractall('.', filter='data')
          PY
          rm source-payload.b64
      - name: Verify source assets and tests
        run: |
          node --check site/assets/app.js
          node --check site/assets/qrcode.js
          node --test tests/smoke.mjs
      - name: Save editable source to new GitHub repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unpack independent DAWAT studio source' || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
